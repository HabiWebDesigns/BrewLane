<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewlane – Landing Page Template</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap"><nav>
<a href="#top" class="logo" id="logo"></a>
<div class="links" id="links"></div>
<div style="display:flex;gap:8px;align-items:center"><button class="icon" id="mode" aria-label="Toggle dark mode">◐</button><a class="btn" id="navcta" href="#join"></a></div>
</nav></div></header>

<main id="top">
<div class="wrap hero" id="hero"></div>
<section id="features"><div class="wrap"><h2 id="ft"></h2><p class="sub" id="fs"></p><div class="grid" id="fg"></div></div></section>
<section id="pricing"><div class="wrap"><h2 id="pt"></h2><p class="sub" id="ps"></p>
<div class="toggle"><span>Monthly</span><button class="sw" id="bill" aria-pressed="false" aria-label="Toggle yearly billing"></button><span>Yearly <b style="color:var(--accent)" id="save"></b></span></div>
<div class="grid" id="pg"></div></div></section>
<section id="stories"><div class="wrap"><h2 id="tt"></h2><p class="sub" id="ts"></p><div class="grid" id="tg"></div></div></section>
<section id="faq"><div class="wrap"><h2>Questions, answered</h2><p class="sub"> </p><div class="faq" id="fq"></div></div></section>
<section id="join"><div class="wrap"><div class="cta-band"><h2 id="ct"></h2><p id="cs"></p>
<form id="form"><input type="email" id="email" placeholder="you@email.com" required aria-label="Email"><button class="btn" id="cb"></button></form><div class="msg" id="msg" role="status"></div></div></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="theme" id="theme" aria-label="Accent colour"></div>

<script src="js/main.js"></script>
</body>
</html>
